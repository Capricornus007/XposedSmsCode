version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      square:
        patterns:
          - "com.squareup.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
