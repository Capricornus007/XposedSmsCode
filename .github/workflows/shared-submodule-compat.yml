name: Shared Module Compat
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "magisk-ui-kit/**"
      - "smscode-core/**"
      - "scripts/verify_shared_submodule_compat.sh"
  push:
    branches:
      - beta
      - master
    paths:
      - "build-logic/**"
      - "core/**"
      - "app/**"
      - "runtime/**"
      - "magisk-ui-kit/**"
      - "smscode-core/**"
      - "scripts/verify_shared_submodule_compat.sh"

jobs:
  shared-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Verify shared module compatibility
        run: bash scripts/verify_shared_submodule_compat.sh
