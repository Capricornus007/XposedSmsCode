name: Dependency Submission

# Replace "Automatic Dependency Submission" to control triggers (e.g. skip Dependabot branches)
on:
  push:
    branches:
      - beta
  workflow_dispatch:

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: read
      
    # Skip if dependabot (redundant if restricted to beta branch, but safe)
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
          
      - name: Generate Dependency Graph
        id: dependency-graph
        uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph: generate-and-upload
          dependency-graph-exclude-configurations: "^classpath$"

      - name: Validate generated dependency graph
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          chmod +x scripts/validate_dependabot_graph.sh
          snapshot="${{ steps.dependency-graph.outputs.dependency-graph-file }}"
          test -n "${snapshot}"
          scripts/validate_dependabot_graph.sh --snapshot "${snapshot}"

      - name: Submit Dependency Graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot="${{ steps.dependency-graph.outputs.dependency-graph-file }}"
          test -n "${snapshot}"

          max_retries=3
          attempt=0
          while [ $((++attempt)) -le "$max_retries" ]; do
            if gh api \
              --method POST \
              "/repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
              --input "${snapshot}"; then
              echo "Dependency graph submitted successfully (attempt $attempt/$max_retries)."
              exit 0
            fi
            if [ "$attempt" -lt "$max_retries" ]; then
              delay=$((attempt * 10))
              echo "Submit failed (attempt $attempt/$max_retries). Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "Failed to submit dependency graph after $max_retries attempts."
          exit 1
