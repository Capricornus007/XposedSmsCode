name: Renovate

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  push:
    branches:
      - master
  workflow_dispatch:
  issues:
    types:
      - edited
  pull_request_target:
    types:
      - edited
    branches:
      - master

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    if: |
      (
        vars.DEPENDENCY_OWNER == '' ||
        vars.DEPENDENCY_OWNER == 'github'
      ) &&
      (
        github.event_name != 'pull_request_target' &&
        github.event_name != 'issues'
      ) ||
      (
        github.event_name == 'push' &&
        github.ref_name == 'master' &&
        github.event.head_commit != null &&
        startsWith(github.event.head_commit.message, 'Merge pull request #') &&
        (
          contains(github.event.head_commit.message, 'from Capricornus007/renovate/') ||
          contains(github.event.head_commit.message, 'from Capricornus007/chore/dependency-force-update') ||
          contains(github.event.head_commit.message, 'from Capricornus007/janitor/security-fixes')
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'master' &&
        github.event.pull_request.user.login == 'Capricornus007' &&
        startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        github.event.changes.body != null &&
        contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->') &&
        !contains(github.event.changes.body.from, '- [x] <!-- rebase-check -->')
      ) ||
      (
        github.event_name == 'issues' &&
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.changes.body != null &&
        contains(github.event.issue.body, 'This issue lists Renovate updates and detected dependencies.')
      )
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.15
        with:
          configurationFile: .github/renovate-config.js
          token: ${{ secrets.GH_PAT }}

      - name: Cleanup orphan renovate branches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: echo "Renovate cleanup skipped for self-hosted setup"