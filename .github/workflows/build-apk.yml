name: Build APK/AAB

on:
  push:
    tags:
      - 'v*.*.*'  # Semantic version tag, e.g. v3.1.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            scripts/check_release_guard.sh
          fi

  build-apk:
    name: Build APKs
    needs: [validate-release]
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > app/release.jks

      - name: Build APKs with Splits
        run: ./gradlew assembleGithubRelease -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Artifact-level signing gate: the DSL declares v1+v2+v3, and app/build.gradle.kts
      # silently falls back to the debug signing config when STORE_PASSWORD etc. are missing,
      # so only the built APK can prove it is signed. Rule: every workflow that publishes APKs
      # must go red when the artifact is unsigned, missing a scheme, or signed with a
      # certificate other than the pinned one (users would otherwise have to uninstall first).
      # --min-sdk-version 21 is mandatory: without it apksigner skips the v1 check for
      # minSdk>=24 packages and reports a good APK as "v1: false".
      - name: Verify signed artifacts (v1+v2+v3, pinned certificate)
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 || '0379f8a7e140f67a8d0b3dac73903d4fc7035a03f4068520ae71415171ede03b' }}
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/github/release
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -name '*.apk' 2>/dev/null | sort)
          if (( ${#APKS[@]} == 0 )); then
            echo "FAIL: no APK was produced in $APK_DIR"
            exit 1
          fi
          APKSIGNER="$(command -v apksigner || true)"
          if [[ -z "$APKSIGNER" ]]; then
            SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            APKSIGNER="$(find "$SDK_DIR/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ -z "${APKSIGNER:-}" || ! -x "$APKSIGNER" ]]; then
            echo "FAIL: apksigner not found on the runner"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          for apk in "${APKS[@]}"; do
            echo "== verifying $apk"
            verify_out="$("$APKSIGNER" verify -v --min-sdk-version 21 "$apk" 2>&1)"
            echo "$verify_out"
            for scheme in \
              'v1 scheme (JAR signing)' \
              'v2 scheme (APK Signature Scheme v2)' \
              'v3 scheme (APK Signature Scheme v3)'; do
              if ! grep -qF "Verified using $scheme: true" <<<"$verify_out"; then
                echo "FAIL: $apk does not verify with $scheme"
                exit 1
              fi
            done
            cert_out="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)"
            sha="$(sed -n 's/.*certificate SHA-256 digest: //p' <<<"$cert_out" | head -1 | tr -d '[:space:]')"
            if [[ -z "$sha" ]]; then
              echo "FAIL: $apk carries no signer certificate"
              echo "$cert_out"
              exit 1
            fi
            if [[ "$sha" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "FAIL: $apk is signed by $sha, not the pinned $EXPECTED_CERT_SHA256."
              echo "A debug-keystore fallback would show up exactly here."
              exit 1
            fi
            echo "PASS: $apk v1+v2+v3 true, certificate SHA-256 $sha"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/github/release/*.apk

  release:
    name: Attach APKs to Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: artifacts/apks

      - name: Upload to the tag's release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/apks/*.apk --clobber
