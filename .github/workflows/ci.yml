name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Build
        run: ./gradlew --warning-mode all assembleDebug testDebugUnitTest -PbuildSplits
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for apk in app/build/outputs/apk/debug/*.apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v6
        with:
          name: XposedSmsCode-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v6
        with:
          name: XposedSmsCode-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v6
        with:
          name: XposedSmsCode-debug-x86
          path: app/build/outputs/apk/debug/*x86*.apk
      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v6
        with:
          name: XposedSmsCode-debug-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
      - name: Upload Debug APK (universal)
        uses: actions/upload-artifact@v6
        with:
          name: XposedSmsCode-debug-universal
          path: app/build/outputs/apk/debug/*universal*.apk
