name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - beta
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      GRADLE_OPTS: -Dorg.gradle.warning.mode=all
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
          allow-snapshot-wrappers: true
      - name: Build & Test
        run: >
          bash scripts/with_workspace_gradle_lock.sh --warning-mode all
          :core:check
          :runtime:check
          :app:check
          assembleGithubApi101Debug
          assembleGithubLegacyDebug
          :app:koverVerifyGithubApi101Debug
          :app:koverHtmlReportGithubApi101Debug
          -PbuildSplits
      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Debug APK summary"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            while IFS= read -r apk; do
              if [ ! -f "$apk" ]; then
                continue
              fi
              size=$(du -h "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "| $name | $size |"
            done < <(find app/build/outputs/apk -path '*/debug/*.apk' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Debug APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: XposedSmsCode-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
      - name: Upload Kover Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: app/build/reports/kover/**
