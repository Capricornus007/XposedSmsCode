// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral() // add repository
        maven { url = "https://maven.pkg.jetbrains.space/kotlin/p/kotlin/eap" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20-Beta1"
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.3.20-Beta1"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.20-Beta1"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.5"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://maven.pkg.jetbrains.space/kotlin/p/kotlin/eap" }
        maven { url = "https://api.xposed.info/" }
        maven { url = "https://jitpack.io" }
        maven {
            url = "https://s01.oss.sonatype.org/content/repositories/snapshots/"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
