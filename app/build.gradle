plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
}

def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: findProperty("tianma.keystore.path") ?: "release.jks"
def keyFile = file(keystoreFilePath)
def propertyFile = file(findProperty("tianma.signature.path") ?: "signature.properties")

def keyProps = new Properties()
if (propertyFile.exists()) {
    keyProps.load(new FileInputStream(propertyFile))
}

// Check if signing info is available either via properties or env vars
def isSigningInfoAvailable = keyFile.exists() &&
    (keyProps['STORE_PASSWORD'] != null || System.getenv("STORE_PASSWORD") != null)

def static releaseTime() {
    return new Date().format("yyMMdd", TimeZone.default)
}

def randomHex8() {
    def r = new java.security.SecureRandom()
    return String.format("%08x", r.nextInt() & 0xffffffffL)
}

def VERSION_NAME = "3.1.0-fcm"
def VERSION_CODE = 81

def releaseBaseName = { String versionName ->
    return "XposedSmsCode_v${versionName.replaceAll('\\s+', '_')}" +
        "_${releaseTime()}"
}

def releaseApkName = { String versionName, String buildType, String abiSuffix ->
    return "${releaseBaseName(versionName)}_${buildType}_${abiSuffix}.apk"
}

def releaseAabName = { String versionName ->
    return "${releaseBaseName(versionName)}_release.aab"
}

android {
    namespace = 'com.github.tianma8023.xposed.smscode'

    compileSdk 36
    compileSdkExtension = 1
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.github.tianma8023.xposed.smscode"
        minSdkVersion 24
        targetSdk 36
        versionCode VERSION_CODE
        versionName VERSION_NAME

        buildConfigField("String", "LOG_TAG", "\"XSmsCode\"")
        buildConfigField("int", "MODULE_VERSION", "" + VERSION_CODE)
        resConfigs 'en', 'zh-rCN', 'zh-rTW'

        // vectorDrawables.generatedDensities = ['hdpi']
    }

    if (project.hasProperty('buildSplits')) {
        splits {
            abi {
                enable = true
                reset()
                include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                universalApk = true
            }
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    signingConfigs {
        release {
            storeFile keyFile
            storePassword System.getenv("STORE_PASSWORD") ?: keyProps['STORE_PASSWORD']
            keyAlias System.getenv("KEY_ALIAS") ?: keyProps['KEY_ALIAS']
            keyPassword System.getenv("KEY_PASSWORD") ?: keyProps['KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            buildConfigField("int", "LOG_LEVEL", "2")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")

            if (isSigningInfoAvailable) {
                signingConfig = signingConfigs.release
            }
        }

        alpha {
            minifyEnabled true
            shrinkResources = true
            zipAlignEnabled true
            debuggable = false

            buildConfigField("int", "LOG_LEVEL", "2")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")

            if (isSigningInfoAvailable) {
                signingConfig = signingConfigs.release
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            shrinkResources = true
            zipAlignEnabled true

            buildConfigField("int", "LOG_LEVEL", "4")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")
            if (isSigningInfoAvailable) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            lintOptions {
                disable 'MissingTranslation'
                checkReleaseBuilds = false
            }

            packagingOptions {
                exclude '**/*.kotlin_*'
            }
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
        }
    }

    compileOptions {
        // Keep JDK 25, but emit Java 21 bytecode so Compose/AGP tooling can read it.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType == "debug") {
            def suffixProvider = providers.provider { randomHex8() }
            variant.outputs.each { output ->
                output.versionName.set(suffixProvider.map { "${VERSION_NAME}-${it}" })
            }
        }
        variant.outputs.each { output ->
            def name = output.outputFileName.orNull
            if (name == null) {
                return
            }
            def abiSuffix = name.contains("universal") ? "universal" :
                (name.contains("arm64-v8a") ? "arm64-v8a" :
                (name.contains("armeabi-v7a") ? "armeabi-v7a" :
                (name.contains("x86_64") ? "x86_64" :
                (name.contains("x86") ? "x86" : "universal"))))
            output.outputFileName.set(
                releaseApkName(VERSION_NAME, variant.buildType, abiSuffix)
            )
        }
    }
}

tasks.register("renameReleaseAab") {
    dependsOn("bundleRelease")
    def bundleFileProvider = layout.buildDirectory.file("outputs/bundle/release/app-release.aab")
    def targetFileProvider = layout.buildDirectory.file("outputs/bundle/release/${releaseAabName(VERSION_NAME)}")
    doLast {
        def bundleFile = bundleFileProvider.get().asFile
        if (!bundleFile.exists()) {
            return
        }
        def target = targetFileProvider.get().asFile
        if (target.exists()) {
            target.delete()
        }
        bundleFile.renameTo(target)
    }
}

tasks.matching { it.name == "bundleRelease" }.configureEach {
    finalizedBy("renameReleaseAab")
}

