plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: findProperty("tianma.keystore.path") ?: "release.jks"
def keyFile = file(keystoreFilePath)
def propertyFile = file(findProperty("tianma.signature.path") ?: "signature.properties")

def keyProps = new Properties()
if (propertyFile.exists()) {
    keyProps.load(new FileInputStream(propertyFile))
}

// Check if signing info is available either via properties or env vars
def isSigningInfoAvailable = keyFile.exists() && 
    (keyProps['STORE_PASSWORD'] != null || System.getenv("STORE_PASSWORD") != null)

def static releaseTime() {
    return new Date().format("yyMMdd", TimeZone.default)
}

def VERSION_NAME = "3.0.4"
def VERSION_CODE = 66

android {
    namespace = 'com.github.tianma8023.xposed.smscode'

    compileSdk 36
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.github.tianma8023.xposed.smscode"
        minSdkVersion 35
        targetSdkVersion 36
        versionCode VERSION_CODE
        versionName VERSION_NAME

        buildConfigField("String", "LOG_TAG", "\"XSmsCode\"")
        buildConfigField("int", "MODULE_VERSION", "" + VERSION_CODE)
        resConfigs 'en', 'zh-rCN', 'zh-rTW'

        // vectorDrawables.generatedDensities = ['hdpi']
    }

    if (project.hasProperty('buildSplits')) {
        splits {
            abi {
                enable = true
                reset()
                include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                universalApk = true
            }
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    signingConfigs {
        release {
            storeFile keyFile
            storePassword System.getenv("STORE_PASSWORD") ?: keyProps['STORE_PASSWORD']
            keyAlias System.getenv("KEY_ALIAS") ?: keyProps['KEY_ALIAS']
            keyPassword System.getenv("KEY_PASSWORD") ?: keyProps['KEY_PASSWORD']
        }
    }

    buildTypes {
        debug {
            buildConfigField("int", "LOG_LEVEL", "2")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")

            if (isSigningInfoAvailable) {
                signingConfig = signingConfigs.release
            }
        }

        alpha {
            minifyEnabled true
            shrinkResources = true
            zipAlignEnabled true
            debuggable = false

            buildConfigField("int", "LOG_LEVEL", "2")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")

            if (isSigningInfoAvailable) {
                signingConfig = signingConfigs.release
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled true
            shrinkResources = true
            zipAlignEnabled true

            buildConfigField("int", "LOG_LEVEL", "4")
            buildConfigField("boolean", "LOG_TO_XPOSED", "true")
            if (isSigningInfoAvailable) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            lintOptions {
                disable 'MissingTranslation'
                checkReleaseBuilds = false
            }

            packagingOptions {
                exclude '**/*.kotlin_*'
            }
        }
    }

    compileOptions {
        // Keep JDK 25, but emit Java 21 bytecode so Compose/AGP tooling can read it.
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def name = output.outputFileName.orNull
            if (name == null) {
                return
            }
            def abiSuffix = name.contains("universal") ? "universal" :
                (name.contains("arm64-v8a") ? "arm64-v8a" :
                (name.contains("armeabi-v7a") ? "armeabi-v7a" :
                (name.contains("x86_64") ? "x86_64" :
                (name.contains("x86") ? "x86" : "universal"))))
            output.outputFileName.set(
                "XposedSmsCode_v${VERSION_NAME.replaceAll('\\s+', '_')}" +
                    "_${releaseTime()}_${variant.buildType}_${abiSuffix}.apk"
            )
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':core')
    implementation project(':storage')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.browser
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // Xposed
    compileOnly libs.xposed.api
    // OkHttp
    implementation libs.okhttp
    // OkHttp logging interceptor
    implementation libs.okhttp.logging.interceptor

    // Retrofit
    implementation libs.retrofit
    // Retrofit Kotlin Serialization converter
    implementation libs.retrofit.converter.kotlinx.serialization
    // Retrofit scalars converter
    implementation libs.retrofit.converter.scalars
    // Kotlin Serialization
    implementation libs.kotlinx.serialization.json
    // Coroutines
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.material
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.core
    implementation libs.androidx.material.icons.extended
    implementation libs.androidx.ui.tooling.preview
    debugImplementation libs.androidx.ui.tooling
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.navigation.compose

    // Room
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    testImplementation libs.junit
    implementation libs.timber
    implementation libs.koin.android
    implementation libs.koin.androidx.compose
    implementation libs.koin.compose.viewmodel
    implementation libs.androidx.datastore.preferences
}
