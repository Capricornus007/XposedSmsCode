plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
    // Keep JDK 25, but emit Java 21 bytecode for compatibility with app module.
    sourceCompatibility = JavaVersion.toVersion(libs.versions.javaBytecode.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.javaBytecode.get())
}

kotlin {
    compilerOptions {
        // Emit Java 21 bytecode for compatibility with Compose tooling.
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(libs.versions.javaBytecode.get()))
    }
}

dependencies {
    implementation libs.kotlinx.serialization.json
    implementation libs.retrofit

    testImplementation libs.junit.jupiter
    testImplementation libs.mockk
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
