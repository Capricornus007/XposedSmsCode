include:
  - project: magisk3171/magisk-ci-toolkit
    ref: 3e5823c5c22fac593c329b24221925f63f44ccfe
    file: /.gitlab/ci/android.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 3e5823c5c22fac593c329b24221925f63f44ccfe
    file: /.gitlab/ci/android-release.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 3e5823c5c22fac593c329b24221925f63f44ccfe
    file: /.gitlab/ci/telegram.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 3e5823c5c22fac593c329b24221925f63f44ccfe
    file: /.gitlab/ci/renovate.yml
  - project: magisk3171/magisk-ci-toolkit
    ref: 3e5823c5c22fac593c329b24221925f63f44ccfe
    file: /.gitlab/ci/cancel-mr-pipelines.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-amd64-linux

stages:
  - build
  - quality
  - notify
  - release-validate
  - release-build
  - release-publish
  - maintenance

variables:
  MAGISK_CI_TOOLKIT_REPOSITORY: "https://gitlab.com/magisk3171/magisk-ci-toolkit.git"
  MAGISK_CI_TOOLKIT_REF: "3e5823c5c22fac593c329b24221925f63f44ccfe"
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "0"
  MAGISK_ANDROID_SDKMANAGER_CHANNEL: "3"
  MAGISK_ANDROID_COMPILE_SDK: "37"
  MAGISK_ANDROID_COMPILE_SDK_PACKAGE: "platforms;android-37.0"
  MAGISK_ANDROID_SDK_PACKAGES: "platform-tools build-tools;37.0.0"
  MAGISK_GRADLE_ARGS: "--warning-mode all"
  MAGISK_ANDROID_RELEASE_PACKAGE_NAME: "com.github.tianma8023.xposed.smscode"
  MAGISK_ANDROID_RELEASE_GITHUB_REPOSITORY: "magisk317/XposedSmsCode"
  MAGISK_ANDROID_RELEASE_MODULES_REPO: ""
  MAGISK_ANDROID_RELEASE_PUBLISH_PLAY: "true"
  MAGISK_ANDROID_RELEASE_PLAY_TRACK: "production"
  # Public SHA-256 fingerprint of the production APK signing certificate.
  MAGISK_ANDROID_RELEASE_CERT_SHA256: "027b936e1d82a606d83599548b8b11e49a2c8ae2588c4a9fbe8311e2c54f103a"
  MAGISK_RENOVATE_REPOSITORY: "magisk3171/XposedSmsCode"

.xposed_android_rules:
  cache: []
  rules:
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$DEPENDENCY_OWNER == "gitlab" && $CI_PIPELINE_SOURCE == "api"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^renovate\//'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch .renovate\/.+ into /'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

.xposed_signed_android_rules:
  cache: []
  rules:
    - if: '$RELEASE_KEYSTORE == "" || $STORE_PASSWORD == "" || $KEY_ALIAS == "" || $KEY_PASSWORD == ""'
      when: never
    - !reference [.xposed_android_rules, rules]

android:check:
  extends:
    - .magisk_android_build
    - .xposed_android_rules
  script:
    - |
      set -euo pipefail
      mapfile -t selected_tasks < <(bash scripts/ci/select_android_test_tasks.sh "$MAGISK_CI_TOOLKIT_DIR")
      if ((${#selected_tasks[@]} == 0)); then
        echo "No Android test tasks selected for this change."
        exit 0
      fi
      bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" \
        ${MAGISK_GRADLE_ARGS:---warning-mode all} "${selected_tasks[@]}" -PenableKover=true

cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines

android:build:
  extends:
    - .magisk_android_build
    - .xposed_signed_android_rules
  variables:
    MAGISK_ANDROID_BUILD_TASKS: >-
      :app:assembleGithubDebug
      -PbuildSplits
  artifacts:
    name: "XposedSmsCode-debug-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/**/debug/*.apk

android:detekt:
  extends:
    - .magisk_android_detekt
    - .xposed_android_rules
  stage: quality
  tags:
    - magisk-arm64-linux
  allow_failure: true
  needs: []
  artifacts:
    name: "XposedSmsCode-detekt-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - merged-sarif/detekt.sarif
      - "**/build/reports/detekt/**"

android:release:guard:
  extends: .magisk_android_release_guard
  stage: release-validate
  tags:
    - magisk-arm64-linux

android:release:github-apk:
  extends: .magisk_android_release_apk
  resource_group: xposed-android-release-apk
  stage: release-build
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XposedSmsCode-release-apks-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/apk/**/release/*.apk
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:play-bundle:
  extends: .magisk_android_release_aab
  resource_group: xposed-android-release-play
  stage: release-build
  needs:
    - job: android:release:guard
      artifacts: false
  artifacts:
    name: "XposedSmsCode-release-bundle-$CI_COMMIT_TAG"
    when: always
    expire_in: 30 days
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip

android:release:gitlab:
  extends: .magisk_android_gitlab_release
  resource_group: xposed-android-release-publish
  stage: release-publish
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:release:github-apk
      artifacts: true
    - job: android:release:play-bundle
      artifacts: true
      optional: true

android:release:play:
  extends: .magisk_android_publish_play
  resource_group: xposed-android-release-play
  stage: release-publish
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:release:play-bundle
      artifacts: true

android:ci:play-alpha-bundle:
  extends: .magisk_android_base
  resource_group: xposed-android-release-play
  stage: release-build
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $RELEASE_KEYSTORE != "" && $STORE_PASSWORD != "" && $KEY_ALIAS != "" && $KEY_PASSWORD != "" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  script:
    - |
      set -euo pipefail
      printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > app/release.jks
      bash "$MAGISK_CI_TOOLKIT_DIR/release/resolve_play_release.sh" \
        --package-name "$MAGISK_ANDROID_RELEASE_PACKAGE_NAME" \
        --version-file "$CI_PROJECT_DIR/gradle/libs.versions.toml" \
        --output "$CI_PROJECT_DIR/play-release.env"
      source "$CI_PROJECT_DIR/play-release.env"
      KEYSTORE_FILE=release.jks STORE_PASSWORD="$STORE_PASSWORD" KEY_ALIAS="$KEY_ALIAS" KEY_PASSWORD="$KEY_PASSWORD" \
        bash "$MAGISK_CI_TOOLKIT_DIR/gradle/run_gradle_with_retry.sh" $MAGISK_GRADLE_ARGS :app:bundlePlayRelease \
          -PversionName="$MAGISK_PLAY_VERSION_NAME" -PversionCode="$MAGISK_PLAY_VERSION_CODE"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - app/build/outputs/bundle/**/*.aab
      - app/build/outputs/mapping/**/mapping.txt
      - app/build/outputs/native-debug-symbols/**/native-debug-symbols.zip
      - play-release.env

android:ci:play-alpha:
  extends: .magisk_android_base
  resource_group: xposed-android-release-play
  stage: release-publish
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $CI_PIPELINE_SOURCE == "push" && $MAGISK_ANDROID_RELEASE_PUBLISH_PLAY == "true" && $ANDROID_PUBLISHER_CREDENTIALS != ""'
    - when: never
  needs:
    - job: android:ci:play-alpha-bundle
      artifacts: true
  script:
    - |
      set -euo pipefail
      set -a
      source play-release.env
      set +a
      export MAGISK_PLAY_AAB_FILE="$(find app/build/outputs/bundle -type f -name '*.aab' | sort | head -n 1)"
      export MAGISK_PLAY_MAPPING_FILE="$(find app/build/outputs/mapping -type f -name mapping.txt | sort | head -n 1 || true)"
      export MAGISK_PLAY_SYMBOLS_FILE="$(find app/build/outputs/native-debug-symbols -type f -name native-debug-symbols.zip 2>/dev/null | sort | head -n 1 || true)"
      export MAGISK_RELEASE_ENV_FILE=play-release-status.env
      bash "$MAGISK_CI_TOOLKIT_DIR/release/publish_play.sh"
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      dotenv: play-release-status.env
    paths:
      - play-release-status.env

android:release:modules-repo:
  extends: .magisk_android_publish_modules_repo
  resource_group: xposed-android-release-publish
  stage: release-publish
  tags:
    - magisk-arm64-linux
  needs:
    - job: android:release:github-apk
      artifacts: true

telegram:release:
  extends: .magisk_telegram_release
  stage: release-publish
  allow_failure: true
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #XposedSmsCode"
    MAGISK_TELEGRAM_PROJECT_NAME: "XposedSmsCode"
  needs:
    - job: android:release:github-apk
      artifacts: true
    - job: android:release:gitlab
      artifacts: false

telegram:ci:
  extends:
    - .magisk_telegram_ci
    - .xposed_signed_android_rules
  stage: notify
  allow_failure: true
  tags:
    - magisk-arm64-linux
  variables:
    MAGISK_TELEGRAM_PROJECT_TAG: "📌 #XposedSmsCode"
    MAGISK_TELEGRAM_PROJECT_NAME: "XposedSmsCode"
    MAGISK_TELEGRAM_CI_BRANCH: "beta"
  needs:
    - job: android:check
      artifacts: false
      optional: false
    - job: android:build
      artifacts: true
      optional: false

renovate:gitlab:
  extends: .magisk_renovate_gitlab
  interruptible: false
  stage: maintenance
  tags:
    - magisk-arm64-linux
