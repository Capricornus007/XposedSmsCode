plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace = 'com.tianma.xsmscode.storage'
    compileSdk libs.versions.compileSdk.get().toInteger()
    compileSdkExtension = libs.versions.compileSdkExtension.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
    }

    compileOptions {
        // Keep JDK 25, but emit Java 21 bytecode for toolchain compatibility.
        sourceCompatibility JavaVersion.toVersion(libs.versions.javaBytecode.get())
        targetCompatibility JavaVersion.toVersion(libs.versions.javaBytecode.get())
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(libs.versions.javaBytecode.get()))
        }
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.serialization.json

    testImplementation libs.junit.jupiter
    testImplementation libs.mockk
}
